<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1 Контакты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ui>
            <li>
    <a href="index.html">
        <img src="img/FRa.jpg" width="100" alt="На главную">
    </a>
</li>
        </ui>
    </nav>
    
    <header>
        <h1>Веб-технологии</h1>
    </header>
    <form>
  <div class="flex-input-text">
    <label for="name">Ваше имя:</label>
    <input type="text" name="name" id="name" class="input0range">
  </div>
  <div class="flex-input-text">
            <label class="group-label">Как Вам удобно получить ответ:</label>
            <div class="option-row">
                <input type="radio" name="question" value="email" id="question1" checked>
                <label for="question1">по почте</label>
            </div>
            <div class="option-row">
                <input type="radio" name="question" value="phone" id="question2">
                <label for="question2">по телефону</label>
            </div>
            <div class="option-row">
                <input type="radio" name="question" value="other" id="question3">
                <label for="question3">не нужно отвечать</label>
            </div>
        </div>
  <div class="flex-input-text">
    <label for "question">Укажите тему вопроса</label>
    <select name="category" id="user_category" class="input0range">>
    <option value="work">Работа</option>
    <option value="uni-dubna">Университет</option>
    <option value="business">Бизнес</option>
    <option value="svo">Служба по контракту</option>
    <option value="other_questions">Другие вопросы</option>
    </select>
  </div>
  <div class="flex-input-text">
            <label class="group-label">И еще один вопрос?</label>
            <div class="option-row">
                <input type="checkbox" id="checkbox" name="checkbox">
                <label for="checkbox">может так</label>
            </div>
            <div class="option-row">
                <input type="checkbox" id="checkbox1" name="checkbox">
                <label for="checkbox1">или не так</label>
            </div>
            <div class="option-row">
                <input type="checkbox" id="checkbox2" name="checkbox">
                <label for="checkbox2">иначе</label>
            </div>
        </div>
  <div class="flex-input-text">
    <label for "email">Адрес почты</label>
    <input type="text" name="email" id="user_email" class="input0range">
    </div>
  <div class="flex-input-text">
    <label for="name">Номер телефона:</label>
    <input type="text" name="phone" id="user_phone" class="input0range">
  </div>
  <div class="flex-input-text">
    <label for="message">Сообщение:</label><br>
        <textarea name="message" id="message" cols="30" rows="5"></textarea>
  </div>
  <div class="flex-input-text">
    <input type="submit" value="отправить" class="input0range">
  </div>
  <div>
  </div>
  
</form>
</body>
</html>
